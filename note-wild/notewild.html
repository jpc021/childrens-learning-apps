<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NoteWild">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#c9b6f0">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>NoteWild</title>
<style>
  :root{
    --sky-top:#c9b6f0;
    --sky-bot:#f7f1e3;
    --grass:#8b5e3c;
    --grass-dark:#6e4328;
    --ink:#2a1f2e;
    --cream:#fffaf3;
    --sun:#f4c14d;
    --coral:#e05a8a;
    --berry:#6b3fa0;
    --card:#ffffffee;
    --shadow: 0 6px 0 rgba(0,0,0,0.15);
    --ivory:#f7f1e3;
    --wood:#5c3d2e;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;
    font-family:-apple-system,'Baloo 2','Comic Sans MS',ui-rounded,system-ui,sans-serif;
    background:linear-gradient(180deg,var(--sky-top),var(--sky-bot));
    color:var(--ink);
    touch-action:manipulation;
  }
  #app{position:relative;width:100%;height:100%;overflow:hidden;}
  .screen{position:absolute;inset:0;display:none;flex-direction:column;}
  .screen.active{display:flex;}

  .topbar{display:flex;align-items:center;justify-content:space-between;
    padding:12px 16px 6px;flex-shrink:0;}
  .brand{display:flex;align-items:center;gap:8px;}
  .logo{width:36px;height:36px;flex-shrink:0;filter:drop-shadow(0 3px 0 rgba(0,0,0,0.12));}
  .logo svg{width:100%;height:100%;display:block;}
  .wordmark{font-weight:800;font-size:22px;letter-spacing:0.2px;line-height:1;}
  .wordmark em{font-style:normal;color:var(--coral);}
  .homebtn{display:flex;align-items:center;justify-content:center;text-decoration:none;
    background:var(--card);border:none;border-radius:16px;padding:8px 12px;
    font-weight:800;font-size:15px;color:var(--ink);box-shadow:var(--shadow);}
  .homebtn:active{transform:translateY(4px);box-shadow:none;}
  .dexbtn{display:flex;align-items:center;gap:8px;background:var(--card);border:none;
    border-radius:16px;padding:8px 12px 8px 10px;font-weight:800;font-size:15px;
    color:var(--ink);box-shadow:var(--shadow);}
  .dexbtn:active{transform:translateY(4px);box-shadow:none;}
  .dexgrid{width:22px;height:22px;display:grid;grid-template-columns:1fr 1fr;gap:2px;
    background:linear-gradient(135deg,#6b3fa0,#e05a8a);border-radius:6px;padding:4px;}
  .dexgrid i{background:#fff;border-radius:2px;display:block;}
  .dexcount{background:var(--sun);color:#5a3d00;font-size:11px;font-weight:800;
    min-width:20px;height:20px;border-radius:10px;display:none;align-items:center;
    justify-content:center;padding:0 6px;}
  .dexcount.show{display:flex;}

  .regionswitch{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:4px 16px 10px;flex-shrink:0;}
  .regionswitch button{background:var(--card);border:none;border-radius:12px;
    width:38px;height:38px;font-size:18px;box-shadow:var(--shadow);}
  .regionswitch button:disabled{opacity:0.3;}
  .regionswitch button:not(:disabled):active{transform:translateY(4px);box-shadow:none;}
  .regionname{text-align:center;min-width:180px;}
  .regionname h2{margin:0;font-size:18px;}
  .regionname p{margin:0;font-size:11px;color:#5a4a38;}

  .legend{display:flex;align-items:center;justify-content:center;gap:8px;
    padding:2px 16px 8px;flex-shrink:0;}
  .legend .lg-pill{display:flex;align-items:center;gap:5px;
    background:var(--card);border-radius:999px;padding:5px 12px;
    font-weight:800;font-size:12px;color:var(--ink);box-shadow:var(--shadow);}
  .legend .lg-glyph{width:20px;height:18px;display:block;}
  .legend .lg-pill.locked{opacity:0.55;}
  .legend .lg-pill.locked .lg-lock{font-size:12px;}
  .legend .lg-active{outline:2px solid var(--coral);outline-offset:1px;}

  #mapScroll{flex:1;overflow-y:auto;padding:6px 0 40px;position:relative;}
  .zonewrap{padding:14px 20px;display:flex;flex-direction:column;gap:22px;align-items:center;}
  .zone{width:100%;max-width:420px;display:flex;align-items:center;gap:16px;
    background:var(--card);border-radius:22px;padding:14px 16px;box-shadow:var(--shadow);
    position:relative;}
  .zone.locked{opacity:0.55;}
  .zone.master{background:linear-gradient(120deg,#fff5da,#ffe6c0);}
  .zone.next-region{background:linear-gradient(120deg,#efe6fa,#e8dcf6);}
  .zone .badge{width:58px;height:58px;border-radius:14px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:28px;
    background:radial-gradient(circle at 30% 30%, #fff, var(--berry));
    border:3px solid #4a2a78;}
  .zone.master .badge{background:radial-gradient(circle at 30% 30%, #fff, var(--sun));border-color:#c99a2c;}
  .zone.locked .badge{background:#ccc;border-color:#999;}
  .zone .info{flex:1;}
  .zone .info h3{margin:0 0 4px;font-size:17px;}
  .zone .info p{margin:0;font-size:12px;color:#5a4a38;}
  .zone .go{background:var(--coral);color:#fff;border:none;border-radius:14px;
    padding:10px 14px;font-weight:700;font-size:13px;box-shadow:0 4px 0 #c44572;}
  .zone.master .go{background:var(--sun);color:#5a3d00;box-shadow:0 4px 0 #c99a2c;}
  .zone .go:active{transform:translateY(4px);box-shadow:none;}
  .zone .lock-icon{font-size:22px;}
  .connector{width:4px;height:22px;background:repeating-linear-gradient(180deg,var(--grass-dark) 0 6px, transparent 6px 12px);}

  #battleScreen{background:linear-gradient(180deg,#d8c4f5, #f7f1e3);}
  #battleScreen.gym-mode{background:linear-gradient(180deg,#c4a6e8, #f3c27a);}
  #battleScreen.master-mode{background:linear-gradient(180deg,#f0c36a, #e05a8a);}
  .battle-top{padding:10px 16px;display:flex;justify-content:space-between;align-items:center;}
  .zone-label{font-weight:800;font-size:14px;background:var(--card);padding:6px 12px;border-radius:12px;box-shadow:var(--shadow);}
  .stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;position:relative;min-height:0;}
  #creatureBox{width:170px;height:170px;display:flex;align-items:center;justify-content:center;
    filter:drop-shadow(0 10px 6px rgba(0,0,0,0.15));flex-shrink:0;}
  #creatureBox svg{width:100%;height:100%;}
  #questionDisplay{font-size:36px;font-weight:900;background:var(--card);
    padding:8px 22px;border-radius:16px;box-shadow:var(--shadow);display:none;letter-spacing:1px;}
  #questionDisplay.show{display:block;}
  #questionDisplay.staff{background:#fff;padding:4px 10px 2px;}
  #questionDisplay.staff svg{width:min(240px,72vw);height:auto;display:block;}
  .speakbtn{background:var(--sun);border:none;border-radius:12px;width:56px;height:56px;
    font-size:26px;box-shadow:0 4px 0 #c99a2c;margin-top:4px;flex-shrink:0;}
  .speakbtn:active{transform:translateY(4px);box-shadow:none;}
  .prompt{font-size:13px;color:#5a4a38;margin-top:2px;text-align:center;padding:0 20px;}
  .choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px 20px 26px;flex-shrink:0;}
  .choices.letter-choices.count-3{grid-template-columns:1fr 1fr 1fr;}
  .choices.staff-choices{grid-template-columns:1fr 1fr;gap:10px;padding:10px 14px 20px;}
  .choices.staff-choices.count-3{grid-template-columns:1fr 1fr 1fr;}
  .choice{background:var(--card);border:3px solid transparent;border-radius:18px;
    padding:18px 8px;font-size:24px;font-weight:800;text-align:center;box-shadow:var(--shadow);color:var(--ink);}
  .choice:active{transform:translateY(4px);box-shadow:none;}
  .choice.correct{background:#c8f7c5;border-color:#4caf6b;}
  .choice.wrong{background:#ffd2c9;border-color:var(--coral);}
  .choice.staff-choice{padding:4px 2px;}
  .choice.staff-choice svg{width:100%;height:auto;display:block;}
  .progressbar{display:flex;gap:4px;justify-content:center;padding:6px 0 2px;}
  .progressbar span{width:9px;height:9px;border-radius:3px;background:#ffffff88;border:1px solid #ffffffcc;}
  .progressbar span.filled{background:var(--sun);border-color:#c99a2c;}
  .boss-flag{position:absolute;top:8px;left:50%;transform:translateX(-50%);
    background:var(--berry);color:#fff;font-size:15px;font-weight:800;padding:8px 18px;
    border-radius:14px;letter-spacing:0.8px;box-shadow:0 4px 0 #4a2a78;z-index:2;}
  .boss-flag.master{background:linear-gradient(90deg,#ff9d00,#e05a8a);box-shadow:0 4px 0 #c99a2c;}
  .gym-announce{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    background:rgba(32,24,16,0.62);z-index:20;padding:24px;}
  .gym-announce.show{display:flex !important;}
  .gym-announce-card{background:linear-gradient(165deg,#f4c14d,#e05a8a);color:#2a1f2e;
    border:4px solid #fff;border-radius:28px;padding:32px 22px 28px;text-align:center;
    max-width:360px;width:100%;opacity:1;
    box-shadow:0 10px 0 #c44572, 0 18px 30px rgba(0,0,0,0.28);
    animation:gympop 0.4s ease;}
  .gym-announce-card h2{margin:0 0 12px;font-size:30px;line-height:1.15;letter-spacing:0.2px;}
  .gym-announce-card p{margin:0 0 22px;font-size:20px;font-weight:800;line-height:1.35;color:#3a2416;}
  .gym-announce-tag{display:inline-block;background:#6b3fa0;color:#fff;font-size:13px;
    font-weight:800;padding:6px 14px;border-radius:10px;margin-bottom:14px;letter-spacing:1px;}
  .gym-go{background:#6b3fa0;color:#fff;border:none;border-radius:18px;
    padding:16px 28px;font-size:22px;font-weight:800;box-shadow:0 5px 0 #4a2a78;width:100%;}
  .gym-go:active{transform:translateY(4px);box-shadow:none;}
  .gym-go:disabled{opacity:0.7;}
  .gym-announce-card.win{background:linear-gradient(165deg,#8ce99a,#2a9d8f);}
  .gym-announce-card.win .gym-announce-tag{background:#145e56;}
  .gym-announce-card.lose{background:linear-gradient(165deg,#ffb4a2,#e05a8a);}
  .gym-announce-card.lose .gym-announce-tag{background:#9a3a28;}
  @keyframes gympop{0%{transform:scale(0.72) rotate(-5deg);}
    70%{transform:scale(1.06) rotate(2deg);}
    100%{transform:scale(1) rotate(0deg);}}
  .caughtburst{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    pointer-events:none;font-size:36px;font-weight:900;color:var(--sun);
    text-shadow:0 2px 0 #c99a2c;opacity:0;text-align:center;}
  .caughtburst.show{animation:pop 1.1s ease forwards;}
  @keyframes pop{0%{opacity:0;transform:scale(0.4) rotate(-8deg);}
    30%{opacity:1;transform:scale(1.15) rotate(3deg);}
    70%{opacity:1;transform:scale(1) rotate(0deg);}
    100%{opacity:0;transform:scale(1) translateY(-30px);}}

  #dexScreen{background:var(--cream);}
  .dexhead{padding:14px 18px 6px;display:flex;justify-content:space-between;align-items:center;}
  .dexhead h2{margin:0;font-size:20px;}
  #dexTabs{display:flex;gap:8px;padding:0 16px 8px;flex-shrink:0;overflow-x:auto;}
  #dexTabs button{background:var(--card);border:none;border-radius:12px;padding:8px 14px;
    font-weight:700;font-size:12px;box-shadow:var(--shadow);white-space:nowrap;}
  #dexTabs button.active{background:var(--sun);}
  .dexstats{margin:0 16px 8px;padding:10px 14px;background:var(--card);border-radius:16px;
    box-shadow:var(--shadow);flex-shrink:0;}
  .dexstats p{margin:0;font-size:13px;line-height:1.35;}
  .dexstats strong{font-weight:800;}
  .dexstats .starline{margin-top:4px;font-weight:800;font-size:13px;color:#c99a2c;}
  #dexGrid{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(3,1fr);
    gap:10px;padding:10px 16px 30px;}
  .dexcard{background:var(--card);border-radius:16px;padding:8px 6px 10px;text-align:center;
    box-shadow:var(--shadow);}
  .dexcard.empty{opacity:0.35;}
  .dexcard svg{width:56px;height:56px;}
  .dexcard .w{font-size:12px;font-weight:800;margin-top:2px;}
  .dexcard .stars{font-size:10px;color:var(--sun);letter-spacing:1px;}
  .dexcard.maxed{border:2px solid var(--sun);}

  .backbtn{background:var(--card);border:none;border-radius:14px;padding:8px 14px;
    font-weight:700;font-size:14px;box-shadow:var(--shadow);}
  .backbtn:active{transform:translateY(4px);box-shadow:none;}
</style>
</head>
<body>
<div id="app">

  <div class="screen active" id="mapScreen">
    <div class="topbar">
      <a class="homebtn" href="../index.html">Home</a>
      <div class="brand">
        <span class="logo" aria-hidden="true">
          <svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg">
            <rect x="2" y="2" width="32" height="32" rx="6" fill="#f4c14d"/>
            <rect x="6" y="16" width="4.2" height="14" rx="1" fill="#fff8ee" stroke="#2a1f2e" stroke-width="0.7"/>
            <rect x="10.8" y="16" width="4.2" height="14" rx="1" fill="#fff8ee" stroke="#2a1f2e" stroke-width="0.7"/>
            <rect x="15.6" y="16" width="4.2" height="14" rx="1" fill="#fff8ee" stroke="#2a1f2e" stroke-width="0.7"/>
            <rect x="20.4" y="16" width="4.2" height="14" rx="1" fill="#fff8ee" stroke="#2a1f2e" stroke-width="0.7"/>
            <rect x="25.2" y="16" width="4.2" height="14" rx="1" fill="#fff8ee" stroke="#2a1f2e" stroke-width="0.7"/>
            <rect x="9.4" y="16" width="2.4" height="8" rx="0.4" fill="#2a1f2e"/>
            <rect x="14.2" y="16" width="2.4" height="8" rx="0.4" fill="#2a1f2e"/>
            <rect x="23.8" y="16" width="2.4" height="8" rx="0.4" fill="#2a1f2e"/>
            <ellipse cx="14" cy="11" rx="4.2" ry="3.2" fill="#6b3fa0"/>
            <rect x="17.4" y="4.5" width="1.6" height="7" fill="#6b3fa0"/>
            <path d="M19 4.6 C24 6.2 24 10.4 19 9.2" fill="#e05a8a"/>
          </svg>
        </span>
        <span class="wordmark">Note<em>Wild</em></span>
      </div>
      <button class="dexbtn" onclick="openDex()">
        <span class="dexgrid" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        Dex
        <span class="dexcount" id="dexCount">0</span>
      </button>
    </div>
    <div class="legend" id="clefLegend" role="note" aria-label="Clef modes"></div>
    <div class="regionswitch">
      <button id="regPrev" onclick="shiftRegion(-1)">◀</button>
      <div class="regionname"><h2 id="regionName"></h2><p id="regionSub"></p></div>
      <button id="regNext" onclick="shiftRegion(1)">▶</button>
    </div>
    <div id="mapScroll"><div class="zonewrap" id="zonewrap"></div></div>
  </div>

  <div class="screen" id="battleScreen">
    <div class="battle-top">
      <button class="backbtn" onclick="toMap()">← Map</button>
      <div class="zone-label" id="zoneLabel"></div>
      <div style="width:60px"></div>
    </div>
    <div class="stage">
      <div class="boss-flag" id="bossFlag" style="display:none;">GYM LEADER</div>
      <div id="creatureBox"></div>
      <div id="questionDisplay"></div>
      <button class="speakbtn" onclick="speakQuestion()">🔊</button>
      <div class="prompt" id="promptText">Tap the matching key!</div>
      <div class="progressbar" id="battleProgress"></div>
      <div class="caughtburst" id="caughtburst"></div>
    </div>
    <div class="choices" id="choices"></div>
    <div id="gymAnnounce" class="gym-announce" aria-live="polite">
      <div class="gym-announce-card">
        <div class="gym-announce-tag">GYM BATTLE</div>
        <h2>Gym Battle Started!</h2>
        <p>Get 3 in a row to beat the gym!</p>
        <button class="gym-go" id="gymGoBtn" onclick="startGymBattle()">Let's Go!</button>
      </div>
    </div>
  </div>

  <div class="screen" id="dexScreen">
    <div class="dexhead">
      <h2>Wildling Dex</h2>
      <button class="backbtn" onclick="toMap()">← Map</button>
    </div>
    <div id="dexTabs"></div>
    <div class="dexstats" id="dexStats"></div>
    <div id="dexGrid"></div>
  </div>

</div>

<script>
if (!window.storage) {
  window.storage = {
    async get(key) {
      const value = localStorage.getItem(key);
      return value == null ? null : { value };
    },
    async set(key, value) {
      localStorage.setItem(key, value);
    }
  };
}

/* ---------------- NOTES / AUDIO ---------------- */
const LETTERS = ['C','D','E','F','G','A','B'];
const TREBLE_LETTERS = ['C','D','E','F','G','A','B'];
const BASS_LETTERS = ['G','A','B','C','D','E','F'];
const FREQ = {
  treble: {C:261.63, D:293.66, E:329.63, F:349.23, G:392.00, A:440.00, B:493.88},
  bass:   {G:98.00,  A:110.00, B:123.47, C:130.81, D:146.83, E:164.81, F:174.61},
};
const CLEF_LETTERS = {treble: TREBLE_LETTERS, bass: BASS_LETTERS};
const NOTE_SPEAK = {C:'see', D:'dee', E:'ee', F:'eff', G:'jee', A:'ay', B:'bee'};
let audioCtx = null;

function noteItems(prefix, letters){
  return letters.map(l => prefix + ':' + l);
}
function noteLetter(id){
  const parts = String(id).split(':');
  return parts[1] || String(id);
}
function speakableNote(note){
  return NOTE_SPEAK[note] || String(note).toLowerCase();
}
function itemLabel(id){
  return noteLetter(id);
}
function ensureAudio(){
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return null;
  if(!audioCtx) audioCtx = new AC();
  if(audioCtx.state === 'suspended'){
    try{ audioCtx.resume(); }catch(e){}
  }
  return audioCtx;
}
function playPitch(letter, clef, duration){
  const ctx = ensureAudio();
  if(!ctx) return;
  const table = FREQ[clef] || FREQ.treble;
  const freq = table[letter];
  if(!freq) return;
  const dur = duration || 0.72;
  const now = ctx.currentTime;
  const master = ctx.createGain();
  master.gain.setValueAtTime(0.24, now);
  master.gain.exponentialRampToValueAtTime(0.001, now + dur);
  master.connect(ctx.destination);
  [
    {mult:1, type:'triangle', vol:0.72},
    {mult:2, type:'sine', vol:0.22},
    {mult:3, type:'sine', vol:0.1},
    {mult:4, type:'sine', vol:0.045},
  ].forEach(h => {
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = h.type;
    osc.frequency.value = freq * h.mult;
    g.gain.value = h.vol;
    osc.connect(g).connect(master);
    osc.start(now);
    osc.stop(now + dur + 0.04);
  });
}
document.addEventListener('pointerdown', () => { ensureAudio(); }, {passive:true});

/* ---------------- STAFF DRAW ---------------- */
const STAFF_YMAP = {
  treble: {C: 2, D: 1, E: 0, F: -1, G: -2, A: -3, B: -4},
  bass:   {G: 0, A: -1, B: -2, C: -3, D: -4, E: -5, F: -6},
};
function staffSVG(letter, opts){
  opts = opts || {};
  const clef = (opts.clef === 'bass') ? 'bass' : 'treble';
  const compact = !!opts.compact;
  const w = compact ? 150 : 220;
  const h = compact ? 112 : 156;
  const spacing = compact ? 9 : 12;
  const eLine = compact ? 78 : 108;
  const noteX = compact ? 92 : 128;
  const lineX1 = compact ? 38 : 52;
  const lineX2 = w - 10;
  const lines = [0,1,2,3,4].map(i => {
    const ly = eLine - i * spacing * 2;
    return `<line x1="${lineX1}" y1="${ly}" x2="${lineX2}" y2="${ly}" stroke="#2a1f2e" stroke-width="2"/>`;
  }).join('');
  const step = (STAFF_YMAP[clef][letter] !== undefined) ? STAFF_YMAP[clef][letter] : 0;
  const y = eLine + step * spacing;
  let ledger = '';
  if(step > 0){
    for(let pos = 2; pos <= step; pos += 2){
      const ly = eLine + pos * spacing;
      ledger += `<line x1="${noteX-16}" y1="${ly}" x2="${noteX+18}" y2="${ly}" stroke="#2a1f2e" stroke-width="2"/>`;
    }
  }
  let clefSVG;
  if(clef === 'treble'){
    const clefScale = compact ? 0.72 : 1;
    const gLine = eLine - spacing * 2;
    const clefY = gLine - (compact ? 24 : 33);
    clefSVG = `<g transform="translate(${compact ? 6 : 10},${clefY}) scale(${clefScale})">
      <path d="M22 8 C36 8 42 22 34 32 C26 42 16 40 16 30 C16 18 32 20 34 34 C38 52 14 64 12 86 C10 104 24 114 32 112 C42 109 40 96 30 96 C24 96 24 106 32 106"
        fill="none" stroke="#2a1f2e" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="32" cy="106" r="5" fill="#2a1f2e"/>
      <line x1="22" y1="8" x2="22" y2="-2" stroke="#2a1f2e" stroke-width="3.4" stroke-linecap="round"/>
      <circle cx="22" cy="-5" r="3.1" fill="#2a1f2e"/>
    </g>`;
  } else {
    const fLine = eLine - spacing * 6;
    const headX = compact ? 46 : 60;
    const headR = compact ? 6.5 : 9;
    const dotDX = compact ? 9 : 12;
    const dotR = compact ? 1.8 : 2.4;
    const sw = compact ? 3 : 3.6;
    clefSVG = `<g>
      <path d="M${headX + headR - 1} ${fLine - 1} C ${headX + headR - 1} ${fLine - 26} ${headX + headR * 3.2} ${fLine - 28} ${headX + headR * 3.0} ${fLine - 12} C ${headX + headR * 2.9} ${fLine - 1} ${headX + headR * 1.1} ${fLine - 1} ${headX + headR * 0.9} ${fLine - 11}"
        fill="none" stroke="#2a1f2e" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="${headX}" cy="${fLine}" r="${headR}" fill="#2a1f2e"/>
      <circle cx="${headX + dotDX}" cy="${fLine - spacing * 0.75}" r="${dotR}" fill="#2a1f2e"/>
      <circle cx="${headX + dotDX}" cy="${fLine + spacing * 0.75}" r="${dotR}" fill="#2a1f2e"/>
    </g>`;
  }
  const rx = compact ? 9 : 11;
  const ry = compact ? 6.5 : 8;
  const stemH = compact ? 32 : 40;
  const note = `<ellipse cx="${noteX}" cy="${y}" rx="${rx}" ry="${ry}" transform="rotate(-20 ${noteX} ${y})" fill="#2a1f2e"/>
    <rect x="${noteX + rx - 3}" y="${y - stemH}" width="${compact ? 2.4 : 3}" height="${stemH}" fill="#2a1f2e"/>`;
  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">${clefSVG}${lines}${ledger}${note}</svg>`;
}
/* ---------------- REGION / ITEM DATA ---------------- */
function clusterZones(prefix, type, scale, names, icons){
  const w1 = [scale[0], scale[1], scale[2]];
  const w2 = [scale[2], scale[3], scale[4]];
  const w3 = [scale[4], scale[5], scale[6]];
  return [
    {name:names[0], icon:icons[0], type, items:noteItems(prefix, w1), catchesForBoss:8},
    {name:names[1], icon:icons[1], type, items:noteItems(prefix, w2), catchesForBoss:8},
    {name:names[2], icon:icons[2], type, items:noteItems(prefix, w3), catchesForBoss:8},
    {name:names[3], icon:icons[3], type, items:noteItems(prefix, scale), catchesForBoss:20},
  ];
}

    zones: clusterZones('treb', 'name-note', TREBLE_LETTERS,

function regionAllItems(r){
  const seen = [];
  r.zones.forEach(z => z.items.forEach(id => {
    if(seen.indexOf(id) === -1) seen.push(id);
  }));
  const scale = (r.clef === 'bass') ? BASS_LETTERS : TREBLE_LETTERS;
  seen.sort((a, b) => scale.indexOf(noteLetter(a)) - scale.indexOf(noteLetter(b)));
  return seen;
}
const ALL_ITEMS = [];

const ITEM_META = {};
REGIONS.forEach((r, ri) => r.zones.forEach((z, zi) => {

/* ---------------- STORAGE ---------------- */
async function loadState(){
  try{
    const res = await window.storage.get('notewild-save', false);
    if(res && res.value){
      const saved = JSON.parse(res.value);
      state = Object.assign(state, saved);
      if(!state.items) state.items = {};
      ALL_ITEMS.forEach(id => { if(!(id in state.items)) state.items[id] = 0; });

}

/* ---------------- CREATURE ART ---------------- */
function hashWord(w){ let h=0; for(let i=0;i<w.length;i++){ h=(h*31+w.charCodeAt(i))>>>0; } return h; }
const PALETTES = [
  ["#6b3fa0","#4a2a78"], ["#e05a8a","#c44572"], ["#f4c14d","#d4a02a"],
  ["#8b5e3c","#6e4328"], ["#c9b6f0","#9a7ad4"], ["#5c8a6a","#3d6a4e"],
];
function creatureSVG(id, level){
  const h = hashWord(id);
  const pal = PALETTES[h % PALETTES.length];
  const eyeStyle = h % 3;
  const flagStyle = (h >> 3) % 3;
  const spikes = level >= 4;
  const wings = level >= 3;
  const crown = level >= MAX_LEVEL;
  let flag = '';
  if(flagStyle===0) flag = `<path d="M86 22 C112 30 112 52 86 46" fill="${pal[0]}"/>`;
  if(flagStyle===1) flag = `<polygon points="86,20 112,28 86,40" fill="${pal[0]}"/>`;
  if(flagStyle===2) flag = `<path d="M86 20 Q110 24 108 36 Q96 32 86 34" fill="${pal[0]}"/>`;
  let eyes = '';
  if(eyeStyle===0) eyes = `<ellipse cx="40" cy="70" rx="5" ry="6" fill="#2a1f2e"/><ellipse cx="60" cy="70" rx="5" ry="6" fill="#2a1f2e"/><circle cx="41.5" cy="68" r="1.6" fill="#fff"/><circle cx="61.5" cy="68" r="1.6" fill="#fff"/>`;
  if(eyeStyle===1) eyes = `<ellipse cx="40" cy="70" rx="4" ry="8" fill="#2a1f2e"/><ellipse cx="60" cy="70" rx="4" ry="8" fill="#2a1f2e"/>`;
  if(eyeStyle===2) eyes = `<path d="M34,72 Q40,64 48,72" stroke="#2a1f2e" stroke-width="3.4" fill="none" stroke-linecap="round"/><path d="M54,72 Q60,64 68,72" stroke="#2a1f2e" stroke-width="3.4" fill="none" stroke-linecap="round"/>`;
  let extras = '';
  if(wings) extras += `<ellipse cx="16" cy="68" rx="12" ry="18" fill="${pal[1]}" opacity="0.85" transform="rotate(-22 16 68)"/><ellipse cx="86" cy="78" rx="11" ry="16" fill="${pal[1]}" opacity="0.85" transform="rotate(18 86 78)"/>`;
  if(spikes) extras += `<polygon points="50,28 56,42 44,42" fill="${pal[1]}"/>`;
  if(crown) extras += `<polygon points="36,34 41,20 46,32 51,18 56,32 61,20 66,34" fill="#f4c14d" stroke="#c99a2c" stroke-width="1.5"/>`;
  return `<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
    <rect x="80" y="20" width="6" height="50" rx="2" fill="${pal[1]}"/>
    ${flag}
    <ellipse cx="50" cy="74" rx="32" ry="26" fill="${pal[0]}" stroke="${pal[1]}" stroke-width="4"/>
    <rect x="34" y="98" width="12" height="8" rx="2" fill="${pal[1]}"/>
    <rect x="56" y="98" width="12" height="8" rx="2" fill="${pal[1]}"/>
    ${extras}
    ${eyes}
    <path d="M42,86 Q50,92 60,86" stroke="#2a1f2e" stroke-width="3" fill="none" stroke-linecap="round"/>
    <ellipse cx="50" cy="74" rx="32" ry="26" fill="none" stroke="#ffffff55" stroke-width="3"/>
  </svg>`;
}

/* ---------------- QUESTIONS ---------------- */
function resolveClef(metaClef){
  if(metaClef === 'mixed') return Math.random() < 0.5 ? 'treble' : 'bass';
  return (metaClef === 'bass') ? 'bass' : 'treble';
}
function makeQuestion(id){
  const meta = ITEM_META[id];
  const note = noteLetter(id);
  const clef = resolveClef(meta.clef);
  const gymPrompt = current.mode === 'master'
    ? `Master trial! Get ${MASTER_STREAK} correct in a row!`
    : current.mode === 'boss'
      ? `Gym Battle! Get ${GYM_STREAK} in a row to beat the gym!`
      : null;
  return {
    id, type: 'name-note', note,
    prompt: gymPrompt || 'What note is this?',
    speakText: 'What note is this?',
    speakLetter: false,
    answer: note,
    display: 'staff',
    clef,
  };
}
function nearbyLetters(note, count, scale){
  scale = scale || LETTERS;
  const i = scale.indexOf(note);
  const out = [];
  [-1,1,-2,2,-3,3].forEach(o => {
    const j = i + o;
    if(j >= 0 && j < scale.length && out.indexOf(scale[j]) === -1) out.push(scale[j]);
  });
  scale.forEach(l => { if(l !== note && out.indexOf(l) === -1) out.push(l); });
  return out.slice(0, count);
}
function choiceLetters(q){
  const scale = CLEF_LETTERS[(q && q.clef) || 'treble'];
  const unique = [];
  currentItemPool().forEach(id => {
    const l = noteLetter(id);
    if(unique.indexOf(l) === -1) unique.push(l);
  });
  if(unique.length <= 4) return unique.slice();
  return [q.note].concat(nearbyLetters(q.note, 3, scale));
}

/* ---------------- MAP RENDER ---------------- */
function zoneUnit(){
  return 'notes';
}
function zoneStatus(ri, zi){
  const z = REGIONS[ri].zones[zi];
  const maxedCount = z.items.filter(id => state.items[id] >= MAX_LEVEL).length;
  const catches = z.items.reduce((s, id) => s + Math.min(state.items[id], MAX_LEVEL), 0);
  const bossReady = catches >= (z.catchesForBoss || 8);
  const cleared = !!state.bossCleared[ri + '-' + zi];
  return {catches, maxedCount, bossReady, cleared};
}
function regionAllBossesCleared(ri){
  return REGIONS[ri].zones.every((_, zi) => state.bossCleared[ri + '-' + zi]);
}
function highestUnlockedRegion(){
  const bothCleared = !!(state.masterCleared[0] && state.masterCleared[1]);
  return bothCleared ? 2 : 1;
}
function clampRegionUnlocks(){
  const max = highestUnlockedRegion();
  if(state.regionUnlocked !== max) state.regionUnlocked = max;
  if(viewingRegion > state.regionUnlocked) viewingRegion = state.regionUnlocked;
}
function regionPlayable(ri){
  return Number.isInteger(ri) && ri >= 0 && ri <= state.regionUnlocked && ri < REGIONS.length;
}
function shiftRegion(dir){
  const target = viewingRegion + dir;
  if(target < 0 || !regionPlayable(target)) return;
  viewingRegion = target;
  renderMap();
}
const LEGEND_TREBLE = `<svg class="lg-glyph" viewBox="0 0 20 18" aria-hidden="true"><g fill="none" stroke="#2a1f2e" stroke-width="1.6"><path d="M12.5 16 C6 15 4 8 7 4.4 C9 2 13.5 2.6 13.7 6.2 C13.9 10 9 11 8.6 15 C8.3 17.4 11 18 12 16.7 C12.8 15.7 12.2 14.6 11 14.9 C9.8 15.2 9.4 16.2 10 16.9 C10.6 17.5 12 17.3 12.5 16" /><circle cx="11.2" cy="9.4" r="1" fill="#2a1f2e" stroke="none"/></g></svg>`;
const LEGEND_BASS = `<svg class="lg-glyph" viewBox="0 0 20 18" aria-hidden="true"><g fill="#2a1f2e"><path d="M6 3 C12 1 17 5 16.5 10 C16.2 13.4 13 16.5 8.5 16 C12 15 14 12 13 8 C12 4.5 8.5 4 6.2 5.4 L6 6.4 C9.4 4.6 11.8 6.4 11.4 9.4 C11 12.6 8 14 5 13.2 C7.5 13 10 11.6 10.3 9 C10.6 6.8 8.6 5.6 6 5.6 Z" /><circle cx="13.4" cy="8" r="1.1"/><circle cx="13.4" cy="12.4" r="1.1"/></g></svg>`;
function renderLegend(){

function renderMap(){
  const r = REGIONS[viewingRegion];

function regionDexStats(ri){
  const items = regionAllItems(REGIONS[ri]);
  const collected = items.filter(id => (state.items[id] || 0) > 0).length;
  const stars = items.reduce((s, id) => s + Math.min(state.items[id] || 0, MAX_LEVEL), 0);
  return { collected, total: items.length, stars, maxStars: items.length * MAX_LEVEL };
}
function updateDexButton(){

let gymStartThen = null;

function enterZone(ri, zi){
  ensureAudio();
  if(!regionPlayable(ri)) return;
  if(zi > (state.zoneUnlockedInRegion[ri] || 0)) return;
  current.regionIndex = ri; current.zoneIndex = zi;
  const st = zoneStatus(ri, zi);
  current.mode = (st.bossReady && !st.cleared) ? 'boss' : 'zone';
  current.streak = 0;
  current.misses = 0;
  document.getElementById('zoneLabel').textContent = REGIONS[ri].zones[zi].name;
  setBattleChrome();
  showScreen('battleScreen');
  if(current.mode === 'boss'){
    nextQuestion({silent:true});
    announceGymStart(() => announceQuestion());
  } else {
    nextQuestion();
  }

function enterMaster(ri){
  ensureAudio();
  if(!regionPlayable(ri) || !regionAllBossesCleared(ri)) return;
  current.regionIndex = ri; current.zoneIndex = null;
  current.mode = 'master'; current.streak = 0;
  document.getElementById('zoneLabel').textContent = REGIONS[ri].masterTitle;
  setBattleChrome();
  showScreen('battleScreen');
  nextQuestion();
}

/* ---------------- BATTLE LOGIC ---------------- */
function currentItemPool(){
  if(current.mode === 'master') return regionAllItems(REGIONS[current.regionIndex]);
  return REGIONS[current.regionIndex].zones[current.zoneIndex].items;
}
function pickItem(pool, avoid){
  let p = pool.filter(id => state.items[id] < MAX_LEVEL);
  if(p.length === 0) p = pool.slice();
  if(avoid && p.length > 1) p = p.filter(id => id !== avoid);
  return p[Math.floor(Math.random() * p.length)];
}
function renderQuestionDisplay(q){
  const disp = document.getElementById('questionDisplay');
  disp.className = 'show staff';
  disp.innerHTML = staffSVG(q.note, { clef: q.clef });
}
function nextQuestion(opts){
  const pool = currentItemPool();
  const item = pickItem(pool, current.item);
  current.item = item;
  const q = makeQuestion(item);
  current.q = q;
  const level = Math.min(state.items[item], MAX_LEVEL);
  document.getElementById('creatureBox').innerHTML = creatureSVG(item, level);
  document.getElementById('promptText').textContent = q.prompt;
  renderQuestionDisplay(q);
  renderProgress();
  buildAnswers(q);
  current.voice = null;
  if(!opts || !opts.silent) setTimeout(announceQuestion, 350);
}
function renderProgress(){
  const bar = document.getElementById('battleProgress');
  bar.innerHTML = '';
  if(current.mode === 'boss' || current.mode === 'master'){
    const need = current.mode === 'master' ? MASTER_STREAK : GYM_STREAK;
    for(let k=0;k<need;k++){
      const s = document.createElement('span');
      if(k < current.streak) s.classList.add('filled');
      bar.appendChild(s);
    }
  } else {
    const lvl = Math.min(state.items[current.item], MAX_LEVEL);
    for(let k=0;k<MAX_LEVEL;k++){
      const s = document.createElement('span');
      if(k < lvl) s.classList.add('filled');
      bar.appendChild(s);
    }
  }
}
function buildAnswers(q){
  const box = document.getElementById('choices');
  box.innerHTML = '';
  box.className = 'choices';
  const letters = choiceLetters(q);
  shuffle(letters);
  box.classList.add('letter-choices');
  if(letters.length === 3) box.classList.add('count-3');
  letters.forEach(letter => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'choice';
    b.dataset.answer = letter;
    b.textContent = letter;
    b.onclick = () => handleChoice(letter, q, b);
    box.appendChild(b);
  });
}
function shuffle(arr){ for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } }

function handleChoice(picked, q, btnEl){
  const allBtns = document.querySelectorAll('.choice');
  allBtns.forEach(b => b.onclick = null);
  if(picked === q.answer){
    btnEl.classList.add('correct');
    playPitch(q.note, q.clef);
    onCorrect();
  } else {
    btnEl.classList.add('wrong');
    if(current.mode === 'boss'){
      current.streak = 0;
      current.misses = (current.misses || 0) + 1;
      renderProgress();
      if(current.misses >= GYM_MISSES){
        setTimeout(() => showGymResult(false), 600);
        return;
      }
      burst("Try again!");
      setTimeout(nextQuestion, 800);
      return;
    }
    setTimeout(() => {
      allBtns.forEach(b => {
        b.classList.remove('wrong');
        b.onclick = () => handleChoice(b.dataset.answer, q, b);
      });
    }, 550);
  }
}
function onCorrect(){
  if(current.mode === 'boss' || current.mode === 'master'){
    current.streak++;
    renderProgress();
    const need = current.mode === 'master' ? MASTER_STREAK : GYM_STREAK;
    if(current.streak >= need){
      if(current.mode === 'boss'){
        state.bossCleared[current.regionIndex + '-' + current.zoneIndex] = true;
        const ri = current.regionIndex;
        if(current.zoneIndex === (state.zoneUnlockedInRegion[ri] || 0) && current.zoneIndex < REGIONS[ri].zones.length-1){
          state.zoneUnlockedInRegion[ri] = current.zoneIndex + 1;
        }
        saveState();
        setTimeout(() => showGymResult(true), 500);
      } else {
        state.masterCleared[current.regionIndex] = true;
        clampRegionUnlocks();
        viewingRegion = state.regionUnlocked;
        saveState();
        burst("Region Mastered! 👑");
        setTimeout(toMap, 1300);
      }
      return;
    }
    burst("Nice!");
    setTimeout(nextQuestion, 900);
  } else {
    state.items[current.item] = Math.min(state.items[current.item] + 1, MAX_LEVEL);
    const leveled = state.items[current.item];
    saveState();
    burst(leveled >= MAX_LEVEL ? "Mastered! ✨" : "Caught! +1");
    setTimeout(() => {
      const st = zoneStatus(current.regionIndex, current.zoneIndex);
      if(st.bossReady && !st.cleared && current.mode !== 'boss'){
        current.mode = 'boss'; current.streak = 0;
        setBattleChrome();
        nextQuestion({silent:true});
        announceGymStart(() => announceQuestion());
        return;
      }
      nextQuestion();
    }, 1000);
  }
}
function burst(msg){
  const el = document.getElementById('caughtburst');
  el.textContent = msg;
  el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
}
function allVoices(){
  try{ return speechSynthesis.getVoices() || []; }catch(e){ return []; }
}
function findVoice(needles){
  const voices = allVoices();
  for(const needle of needles){
    const hit = voices.find(v => (v.name || '').toLowerCase().includes(needle));
    if(hit) return hit;
  }
  return voices.find(v => (v.lang || '').toLowerCase().startsWith('en')) || voices[0] || null;
}
function davidVoice(){
  return findVoice(['david', 'alex', 'daniel', 'fred']);
}
function ziraVoice(){
  return findVoice(['zira', 'samantha', 'victoria', 'karen']);
}
function pickSpeakVoice(){
  const gender = Math.random() < 0.5 ? 'female' : 'male';
  const voice = gender === 'female' ? ziraVoice() : davidVoice();
  return {
    gender,
    name: voice ? voice.name : null,
    uri: voice ? voice.voiceURI : null,
  };
}
function resolveVoice(sel){
  if(!sel) return null;
  if(sel.gender === 'female') return ziraVoice();
  if(sel.gender === 'male') return davidVoice();
  return findVoice([sel.name || '']);
}
if(window.speechSynthesis){
  speechSynthesis.addEventListener('voiceschanged', () => {});
  try{ speechSynthesis.getVoices(); }catch(e){}
}
function stopSpeak(){
  try{ speechSynthesis.cancel(); }catch(e){}
}
function speakText(text, sel){
  if(!text) return;
  try{
    stopSpeak();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 0.85;
    u.pitch = 1;
    const voice = resolveVoice(sel);
    if(voice) u.voice = voice;
    speechSynthesis.speak(u);
  }catch(e){}
}
function speakTextThen(text, sel, then){
  if(!text){ if(then) then(); return; }
  let done = false;
  const finish = () => { if(done) return; done = true; if(then) then(); };
  try{
    stopSpeak();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 0.85;
    u.pitch = 1;
    const voice = resolveVoice(sel);
    if(voice) u.voice = voice;
    u.onend = finish;
    u.onerror = finish;
    speechSynthesis.speak(u);
    setTimeout(finish, 1400);
  }catch(e){ finish(); }
}
function announceQuestion(){
  ensureAudio();
  if(!current.q) return;
  try{
    if(!current.voice) current.voice = pickSpeakVoice();
    if(current.q.speakLetter){
      speakTextThen(current.q.speakText, current.voice, () => playPitch(current.q.note, current.q.clef));
    } else {
      speakText(current.q.speakText, current.voice);
    }
  }catch(e){}
}
function speakQuestion(){
  ensureAudio();
  if(!current.q) return;
  try{
    if(!current.voice) current.voice = pickSpeakVoice();
    if(current.q.speakLetter){
      speakTextThen(current.q.speakText, current.voice, () => playPitch(current.q.note, current.q.clef));
    } else {
      playPitch(current.q.note, current.q.clef);
    }
  }catch(e){}
}

/* ---------------- DEX ---------------- */
let dexRegionFilter = 0;
function renderDex(){
  dexRegionFilter = Math.min(dexRegionFilter, state.regionUnlocked);
  const tabs = document.getElementById('dexTabs');
  tabs.innerHTML = '';
  REGIONS.forEach((r, i) => {
    if(i > state.regionUnlocked) return;
    const b = document.createElement('button');
    b.textContent = r.name;
    b.className = i === dexRegionFilter ? 'active' : '';
    b.onclick = () => { dexRegionFilter = i; renderDex(); };
    tabs.appendChild(b);
  });
  const stats = regionDexStats(dexRegionFilter);
  const r = REGIONS[dexRegionFilter];
  document.getElementById('dexStats').innerHTML =
    `<p>You've collected <strong>${stats.collected}/${stats.total}</strong> Wildlings in ${r.name}</p>` +
    `<p class="starline">★ ${stats.stars} / ${stats.maxStars} stars</p>`;
  const grid = document.getElementById('dexGrid');
  grid.innerHTML = '';
  regionAllItems(REGIONS[dexRegionFilter]).forEach(id => {
    const lvl = state.items[id] || 0;
    const discovered = lvl > 0;
    const div = document.createElement('div');
    div.className = 'dexcard' + (discovered ? '' : ' empty') + (lvl >= MAX_LEVEL ? ' maxed' : '');
    div.innerHTML = discovered
      ? `${creatureSVG(id, lvl)}<div class="w">${itemLabel(id)}</div><div class="stars">${'★'.repeat(lvl)}${'☆'.repeat(MAX_LEVEL-lvl)}</div>`
      : `<div style="font-size:40px;opacity:0.5;">❓</div><div class="w">???</div>`;
    grid.appendChild(div);
  });
}

/* ---------------- INIT ---------------- */
loadState();
</script>
