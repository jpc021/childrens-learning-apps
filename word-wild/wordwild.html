<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="WordWild">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>WordWild</title>
<style>
  :root{
    --sky-top:#8fd3f4;
    --sky-bot:#c9f2d0;
    --grass:#4caf6b;
    --grass-dark:#3a8a54;
    --ink:#20362c;
    --cream:#fffaf0;
    --sun:#ffc94d;
    --coral:#ff7a5c;
    --berry:#7b5cff;
    --card:#ffffffee;
    --shadow: 0 6px 0 rgba(0,0,0,0.15);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;
    font-family:-apple-system,'Baloo 2','Comic Sans MS',ui-rounded,system-ui,sans-serif;
    background:linear-gradient(180deg,var(--sky-top),var(--sky-bot));
    color:var(--ink);
    touch-action:manipulation;
  }
  #app{position:relative;width:100%;height:100%;overflow:hidden;}
  .screen{position:absolute;inset:0;display:none;flex-direction:column;}
  .screen.active{display:flex;}

  .topbar{display:flex;align-items:center;justify-content:space-between;
    padding:12px 16px 6px;flex-shrink:0;}
  .brand{display:flex;align-items:center;gap:8px;}
  .logo{width:36px;height:36px;flex-shrink:0;filter:drop-shadow(0 3px 0 rgba(0,0,0,0.12));}
  .logo svg{width:100%;height:100%;display:block;}
  .wordmark{font-weight:800;font-size:22px;letter-spacing:0.2px;line-height:1;}
  .wordmark em{font-style:normal;color:var(--coral);}
  .homebtn{display:flex;align-items:center;justify-content:center;text-decoration:none;
    background:var(--card);border:none;border-radius:16px;padding:8px 12px;
    font-weight:800;font-size:15px;color:var(--ink);box-shadow:var(--shadow);}
  .homebtn:active{transform:translateY(4px);box-shadow:none;}
  .dexbtn{display:flex;align-items:center;gap:8px;background:var(--card);border:none;
    border-radius:16px;padding:8px 12px 8px 10px;font-weight:800;font-size:15px;
    color:var(--ink);box-shadow:var(--shadow);}
  .dexbtn:active{transform:translateY(4px);box-shadow:none;}
  .dexgrid{width:22px;height:22px;display:grid;grid-template-columns:1fr 1fr;gap:2px;
    background:linear-gradient(135deg,#7b5cff,#ff7a5c);border-radius:7px;padding:4px;}
  .dexgrid i{background:#fff;border-radius:2px;display:block;}
  .dexcount{background:var(--sun);color:#5a3d00;font-size:11px;font-weight:800;
    min-width:20px;height:20px;border-radius:10px;display:none;align-items:center;
    justify-content:center;padding:0 6px;}
  .dexcount.show{display:flex;}

  .regionswitch{display:flex;align-items:center;justify-content:center;gap:12px;
    padding:4px 16px 10px;flex-shrink:0;}
  .regionswitch button{background:var(--card);border:none;border-radius:12px;
    width:38px;height:38px;font-size:18px;box-shadow:var(--shadow);}
  .regionswitch button:disabled{opacity:0.3;}
  .regionswitch button:not(:disabled):active{transform:translateY(4px);box-shadow:none;}
  .regionname{text-align:center;min-width:180px;}
  .regionname h2{margin:0;font-size:18px;}
  .regionname p{margin:0;font-size:11px;color:#456;}

  #mapScroll{flex:1;overflow-y:auto;padding:6px 0 40px;position:relative;}
  .zonewrap{padding:14px 20px;display:flex;flex-direction:column;gap:22px;align-items:center;}
  .zone{width:100%;max-width:420px;display:flex;align-items:center;gap:16px;
    background:var(--card);border-radius:22px;padding:14px 16px;box-shadow:var(--shadow);
    position:relative;}
  .zone.locked{opacity:0.55;}
  .zone.master{background:linear-gradient(120deg,#fff5da,#ffe6c0);}
  .zone .badge{width:58px;height:58px;border-radius:50%;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:28px;
    background:radial-gradient(circle at 30% 30%, #fff, var(--grass));
    border:3px solid var(--grass-dark);}
  .zone.master .badge{background:radial-gradient(circle at 30% 30%, #fff, var(--sun));border-color:#c99a2c;}
  .zone.locked .badge{background:#ccc;border-color:#999;}
  .zone .info{flex:1;}
  .zone .info h3{margin:0 0 4px;font-size:17px;}
  .zone .info p{margin:0;font-size:12px;color:#556;}
  .zone .go{background:var(--coral);color:#fff;border:none;border-radius:14px;
    padding:10px 14px;font-weight:700;font-size:13px;box-shadow:0 4px 0 #c65b42;}
  .zone.master .go{background:var(--sun);color:#5a3d00;box-shadow:0 4px 0 #c99a2c;}
  .zone .go:active{transform:translateY(4px);box-shadow:none;}
  .zone .lock-icon{font-size:22px;}
  .connector{width:4px;height:22px;background:repeating-linear-gradient(180deg,var(--grass-dark) 0 6px, transparent 6px 12px);}

  #battleScreen{background:linear-gradient(180deg,#a3e2ff, #d8f6c8);}
  #battleScreen.gym-mode{background:linear-gradient(180deg,#9ad4f5, #ffe7a8);}
  #battleScreen.master-mode{background:linear-gradient(180deg,#f0c36a, #f3b08a);}
  .battle-top{padding:10px 16px;display:flex;justify-content:space-between;align-items:center;}
  .zone-label{font-weight:800;font-size:14px;background:var(--card);padding:6px 12px;border-radius:12px;box-shadow:var(--shadow);}
  .stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;position:relative;}
  #creatureBox{width:170px;height:170px;display:flex;align-items:center;justify-content:center;
    filter:drop-shadow(0 10px 6px rgba(0,0,0,0.15));}
  #creatureBox svg{width:100%;height:100%;}
  .speakbtn{background:var(--sun);border:none;border-radius:50%;width:56px;height:56px;
    font-size:26px;box-shadow:0 4px 0 #c99a2c;margin-top:4px;}
  .speakbtn:active{transform:translateY(4px);box-shadow:none;}
  .prompt{font-size:13px;color:#456;margin-top:2px;text-align:center;padding:0 20px;}
  .choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px 20px 26px;flex-shrink:0;}
  .choice{background:var(--card);border:3px solid transparent;border-radius:18px;
    padding:18px 8px;font-size:24px;font-weight:800;text-align:center;box-shadow:var(--shadow);}
  .choice:active{transform:translateY(4px);box-shadow:none;}
  .choice.correct{background:#c8f7c5;border-color:#4caf6b;}
  .choice.wrong{background:#ffd2c9;border-color:var(--coral);}
  .progressbar{display:flex;gap:4px;justify-content:center;padding:6px 0 2px;}
  .progressbar span{width:9px;height:9px;border-radius:50%;background:#ffffff88;border:1px solid #ffffffcc;}
  .progressbar span.filled{background:var(--sun);border-color:#c99a2c;}
  .boss-flag{position:absolute;top:8px;left:50%;transform:translateX(-50%);
    background:var(--berry);color:#fff;font-size:15px;font-weight:800;padding:8px 18px;
    border-radius:14px;letter-spacing:0.8px;box-shadow:0 4px 0 #5a3fd4;z-index:2;}
  .boss-flag.master{background:linear-gradient(90deg,#ff9d00,#ff5fa2);box-shadow:0 4px 0 #c99a2c;}
  .gym-announce{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    background:rgba(32,54,44,0.55);z-index:20;padding:24px;}
  .gym-announce.show{display:flex !important;}
  .gym-announce-card{background:linear-gradient(165deg,var(--sun),var(--coral));color:var(--ink);
    border:4px solid #fff;border-radius:28px;padding:32px 22px 28px;text-align:center;
    max-width:360px;width:100%;opacity:1;
    box-shadow:0 10px 0 #c65b42, 0 18px 30px rgba(0,0,0,0.28);
    animation:gympop 0.4s ease;}
  .gym-announce-card h2{margin:0 0 12px;font-size:30px;line-height:1.15;letter-spacing:0.2px;}
  .gym-announce-card p{margin:0 0 22px;font-size:20px;font-weight:800;line-height:1.35;color:#3a2416;}
  .gym-announce-tag{display:inline-block;background:var(--berry);color:#fff;font-size:13px;
    font-weight:800;padding:6px 14px;border-radius:10px;margin-bottom:14px;letter-spacing:1px;}
  .gym-go{background:var(--berry);color:#fff;border:none;border-radius:18px;
    padding:16px 28px;font-size:22px;font-weight:800;box-shadow:0 5px 0 #5a3fd4;width:100%;}
  .gym-go:active{transform:translateY(4px);box-shadow:none;}
  .gym-go:disabled{opacity:0.7;}
  .gym-announce-card.win{background:linear-gradient(165deg,#8ce99a,var(--grass));}
  .gym-announce-card.win .gym-announce-tag{background:var(--grass-dark);}
  .gym-announce-card.lose{background:linear-gradient(165deg,#ffb4a2,var(--coral));}
  .gym-announce-card.lose .gym-announce-tag{background:#c65b42;}
  @keyframes gympop{0%{transform:scale(0.72) rotate(-5deg);}
    70%{transform:scale(1.06) rotate(2deg);}
    100%{transform:scale(1) rotate(0deg);}}
  .caughtburst{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    pointer-events:none;font-size:36px;font-weight:900;color:var(--sun);
    text-shadow:0 2px 0 #c99a2c;opacity:0;text-align:center;}
  .caughtburst.show{animation:pop 1.1s ease forwards;}
  @keyframes pop{0%{opacity:0;transform:scale(0.4) rotate(-8deg);}
    30%{opacity:1;transform:scale(1.15) rotate(3deg);}
    70%{opacity:1;transform:scale(1) rotate(0deg);}
    100%{opacity:0;transform:scale(1) translateY(-30px);}}

  #dexScreen{background:var(--cream);}
  .dexhead{padding:14px 18px 6px;display:flex;justify-content:space-between;align-items:center;}
  .dexhead h2{margin:0;font-size:20px;}
  #dexTabs{display:flex;gap:8px;padding:0 16px 8px;flex-shrink:0;overflow-x:auto;}
  #dexTabs button{background:var(--card);border:none;border-radius:12px;padding:8px 14px;
    font-weight:700;font-size:12px;box-shadow:var(--shadow);white-space:nowrap;}
  #dexTabs button.active{background:var(--sun);}
  .dexstats{margin:0 16px 8px;padding:10px 14px;background:var(--card);border-radius:16px;
    box-shadow:var(--shadow);flex-shrink:0;}
  .dexstats p{margin:0;font-size:13px;line-height:1.35;}
  .dexstats strong{font-weight:800;}
  .dexstats .starline{margin-top:4px;font-weight:800;font-size:13px;color:#c99a2c;}
  #dexGrid{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(3,1fr);
    gap:10px;padding:10px 16px 30px;}
  .dexcard{background:var(--card);border-radius:16px;padding:8px 6px 10px;text-align:center;
    box-shadow:var(--shadow);}
  .dexcard.empty{opacity:0.35;}
  .dexcard svg{width:56px;height:56px;}
  .dexcard .w{font-size:12px;font-weight:800;margin-top:2px;}
  .dexcard .stars{font-size:10px;color:var(--sun);letter-spacing:1px;}
  .dexcard.maxed{border:2px solid var(--sun);}

  .backbtn{background:var(--card);border:none;border-radius:14px;padding:8px 14px;
    font-weight:700;font-size:14px;box-shadow:var(--shadow);}
  .backbtn:active{transform:translateY(4px);box-shadow:none;}
</style>
</head>
<body>
<div id="app">

  <div class="screen active" id="mapScreen">
    <div class="topbar">
      <a class="homebtn" href="../index.html">Home</a>
      <div class="brand">
        <span class="logo" aria-hidden="true">
          <svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg">
            <circle cx="18" cy="18" r="17" fill="#ffc94d"/>
            <circle cx="11" cy="10" r="5.5" fill="#ff7a5c"/>
            <circle cx="25" cy="10" r="5.5" fill="#ff7a5c"/>
            <circle cx="18" cy="20" r="12" fill="#ff7a5c"/>
            <circle cx="14.2" cy="18" r="2.2" fill="#20362c"/>
            <circle cx="21.8" cy="18" r="2.2" fill="#20362c"/>
            <circle cx="15" cy="17.2" r="0.7" fill="#fff"/>
            <circle cx="22.6" cy="17.2" r="0.7" fill="#fff"/>
            <path d="M14 24 Q18 27.5 22 24" stroke="#20362c" fill="none" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="wordmark">Word<em>Wild</em></span>
      </div>
      <button class="dexbtn" onclick="openDex()">
        <span class="dexgrid" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        Dex
        <span class="dexcount" id="dexCount">0</span>
      </button>
    </div>
    <div class="regionswitch">
      <button id="regPrev" onclick="shiftRegion(-1)">◀</button>
      <div class="regionname"><h2 id="regionName"></h2><p id="regionSub"></p></div>
      <button id="regNext" onclick="shiftRegion(1)">▶</button>
    </div>
    <div id="mapScroll"><div class="zonewrap" id="zonewrap"></div></div>
  </div>

  <div class="screen" id="battleScreen">
    <div class="battle-top">
      <button class="backbtn" onclick="toMap()">← Map</button>
      <div class="zone-label" id="zoneLabel"></div>
      <div style="width:60px"></div>
    </div>
    <div class="stage">
      <div class="boss-flag" id="bossFlag" style="display:none;">GYM LEADER</div>
      <div id="creatureBox"></div>
      <button class="speakbtn" onclick="speakWord()">🔊</button>
      <div class="prompt" id="promptText">Tap the matching word!</div>
      <div class="progressbar" id="battleProgress"></div>
      <div class="caughtburst" id="caughtburst"></div>
    </div>
    <div class="choices" id="choices"></div>
    <div id="gymAnnounce" class="gym-announce" aria-live="polite">
      <div class="gym-announce-card">
        <div class="gym-announce-tag">GYM BATTLE</div>
        <h2>Gym Battle Started!</h2>
        <p>Get 3 in a row to beat the gym!</p>
        <button class="gym-go" id="gymGoBtn" onclick="startGymBattle()">Let's Go!</button>
      </div>
    </div>
  </div>

  <div class="screen" id="dexScreen">
    <div class="dexhead">
      <h2>Wildling Dex</h2>
      <button class="backbtn" onclick="toMap()">← Map</button>
    </div>
    <div id="dexTabs"></div>
    <div class="dexstats" id="dexStats"></div>
    <div id="dexGrid"></div>
  </div>

</div>

<script>
if (!window.storage) {
  window.storage = {
    async get(key) {
      const value = localStorage.getItem(key);
      return value == null ? null : { value };
    },
    async set(key, value) {
      localStorage.setItem(key, value);
    }
  };
}

/* ---------------- REGION / WORD DATA ---------------- */
const REGIONS = [
  {
    name: "Meadow Realm", subtitle: "Sight Words I", masterTitle: "Meadow Master",
    zones: [
      {name:"Sunny Meadow", icon:"🌼", words:["a","and","big","go","up"]},
      {name:"Bubble Brook", icon:"💧", words:["can","come","down","find","help"]},
      {name:"Whisper Woods", icon:"🍃", words:["here","I","in","is","it"]},
      {name:"Sandy Dunes", icon:"🏖️", words:["jump","little","look","make","me"]},
      {name:"Frosty Peak", icon:"❄️", words:["my","not","one","play","red"]},
      {name:"Starlit Cove", icon:"⭐", words:["run","said","see","the","three"]},
      {name:"Wander Falls", icon:"🌊", words:["to","two","we","where","yellow"]},
      {name:"Rainbow Summit", icon:"🌈", words:["you","funny","away","blue","for"]},
    ]
  },
  {
    name: "Ember Highlands", subtitle: "Sight Words II", masterTitle: "Highland Master",
    zones: [
      {name:"Ashen Trail", icon:"🔥", words:["all","am","are","at","ate"]},
      {name:"Copper Hollow", icon:"🍂", words:["be","black","brown","but","came"]},
      {name:"Stonebridge", icon:"🌉", words:["did","do","eat","four","get"]},
      {name:"Amber Grove", icon:"🍁", words:["good","have","he","into","like"]},
      {name:"Thistle Ridge", icon:"🌾", words:["must","new","no","now","on"]},
      {name:"Foggy Hollow", icon:"🌫️", words:["our","out","please","pretty","ran"]},
      {name:"Duskwatch Tower", icon:"🏯", words:["ride","saw","say","she","so"]},
      {name:"Ember Peak", icon:"⛰️", words:["soon","that","there","they","this"]},
    ]
  },
];
const MAX_LEVEL = 5;
const CATCHES_PER_BOSS = 8;
const GYM_STREAK = 3;
const GYM_MISSES = 3;
const MASTER_STREAK = 5;

function regionAllWords(r){ return r.zones.flatMap(z=>z.words); }
const ALL_WORDS = REGIONS.flatMap(regionAllWords);

/* ---------------- STATE ---------------- */
let state = {
  words: {},
  regionUnlocked: 0,
  zoneUnlockedInRegion: {},
  bossCleared: {},
  masterCleared: {},
};
ALL_WORDS.forEach(w=>{ if(!(w in state.words)) state.words[w]=0; });
REGIONS.forEach((r,i)=>{ if(!(i in state.zoneUnlockedInRegion)) state.zoneUnlockedInRegion[i]=0; });

let viewingRegion = 0;
let current = { regionIndex:0, zoneIndex:0, word:null, mode:'zone', streak:0, misses:0, voice:null };

/* ---------------- STORAGE ---------------- */
async function loadState(){
  try{
    const res = await window.storage.get('wordwild-save', false);
    if(res && res.value){
      const saved = JSON.parse(res.value);
      state = Object.assign(state, saved);
      ALL_WORDS.forEach(w=>{ if(!(w in state.words)) state.words[w]=0; });
      REGIONS.forEach((r,i)=>{ if(!(i in state.zoneUnlockedInRegion)) state.zoneUnlockedInRegion[i]=0; });
    }
  }catch(e){}
  viewingRegion = state.regionUnlocked;
  renderMap();
}
async function saveState(){
  try{ await window.storage.set('wordwild-save', JSON.stringify(state), false); }
  catch(e){ console.error('save failed', e); }
}

/* ---------------- CREATURE ART ---------------- */
function hashWord(w){ let h=0; for(let i=0;i<w.length;i++){ h=(h*31+w.charCodeAt(i))>>>0; } return h; }
const PALETTES = [
  ["#ff9d7a","#ff7a5c"], ["#7bd3ff","#4fb4e8"], ["#c6a4ff","#9a6bff"],
  ["#ffd166","#f4a300"], ["#8ce99a","#4caf6b"], ["#ff9ec7","#ff5fa2"],
];
function creatureSVG(word, level){
  const h = hashWord(word);
  const pal = PALETTES[h % PALETTES.length];
  const eyeStyle = h % 3;
  const earStyle = (h>>3) % 3;
  const bodyR = 46;
  const spikes = level >= 4;
  const wings = level >= 3;
  const crown = level >= MAX_LEVEL;
  let ears = '';
  if(earStyle===0) ears = `<circle cx="34" cy="34" r="14" fill="${pal[0]}"/><circle cx="86" cy="34" r="14" fill="${pal[0]}"/>`;
  if(earStyle===1) ears = `<polygon points="30,40 24,10 46,32" fill="${pal[0]}"/><polygon points="90,40 96,10 74,32" fill="${pal[0]}"/>`;
  if(earStyle===2) ears = `<ellipse cx="30" cy="36" rx="10" ry="18" fill="${pal[0]}"/><ellipse cx="90" cy="36" rx="10" ry="18" fill="${pal[0]}"/>`;
  let eyes = '';
  if(eyeStyle===0) eyes = `<circle cx="48" cy="66" r="7" fill="#20362c"/><circle cx="72" cy="66" r="7" fill="#20362c"/><circle cx="50" cy="63" r="2" fill="#fff"/><circle cx="74" cy="63" r="2" fill="#fff"/>`;
  if(eyeStyle===1) eyes = `<ellipse cx="48" cy="66" rx="5" ry="8" fill="#20362c"/><ellipse cx="72" cy="66" rx="5" ry="8" fill="#20362c"/>`;
  if(eyeStyle===2) eyes = `<path d="M42,64 Q48,58 54,64" stroke="#20362c" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M66,64 Q72,58 78,64" stroke="#20362c" stroke-width="4" fill="none" stroke-linecap="round"/>`;
  let extras = '';
  if(wings) extras += `<ellipse cx="18" cy="70" rx="14" ry="24" fill="${pal[1]}" opacity="0.85" transform="rotate(-20 18 70)"/><ellipse cx="102" cy="70" rx="14" ry="24" fill="${pal[1]}" opacity="0.85" transform="rotate(20 102 70)"/>`;
  if(spikes) extras += `<polygon points="60,14 66,28 54,28" fill="${pal[1]}"/>`;
  if(crown) extras += `<polygon points="45,20 50,8 55,18 60,6 65,18 70,8 75,20" fill="#ffd166" stroke="#c99a2c" stroke-width="1.5"/>`;
  return `<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
    ${ears}
    <circle cx="60" cy="70" r="${bodyR}" fill="${pal[0]}" stroke="${pal[1]}" stroke-width="4"/>
    ${extras}
    ${eyes}
    <path d="M52,86 Q60,94 68,86" stroke="#20362c" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <circle cx="60" cy="70" r="${bodyR}" fill="none" stroke="#ffffff55" stroke-width="3"/>
  </svg>`;
}

/* ---------------- MAP RENDER ---------------- */
function zoneStatus(ri, zi){
  const z = REGIONS[ri].zones[zi];
  const maxedCount = z.words.filter(w=>state.words[w]>=MAX_LEVEL).length;
  const catches = z.words.reduce((s,w)=>s+Math.min(state.words[w],MAX_LEVEL),0);
  const bossReady = catches >= CATCHES_PER_BOSS;
  const cleared = !!state.bossCleared[ri+'-'+zi];
  return {catches, maxedCount, bossReady, cleared};
}
function regionAllBossesCleared(ri){
  return REGIONS[ri].zones.every((_,zi)=>state.bossCleared[ri+'-'+zi]);
}
function shiftRegion(dir){
  const target = viewingRegion + dir;
  if(target < 0 || target > state.regionUnlocked) return;
  if(target >= REGIONS.length) return;
  viewingRegion = target;
  renderMap();
}
function renderMap(){
  const r = REGIONS[viewingRegion];
  document.getElementById('regionName').textContent = r.name;
  document.getElementById('regionSub').textContent = r.subtitle;
  document.getElementById('regPrev').disabled = viewingRegion <= 0;
  document.getElementById('regNext').disabled = viewingRegion >= state.regionUnlocked || viewingRegion >= REGIONS.length-1;

  const wrap = document.getElementById('zonewrap');
  wrap.innerHTML = '';
  const unlockedZoneIdx = state.zoneUnlockedInRegion[viewingRegion] || 0;

  r.zones.forEach((z,i)=>{
    const unlocked = i <= unlockedZoneIdx;
    const st = zoneStatus(viewingRegion, i);
    const div = document.createElement('div');
    div.className = 'zone' + (unlocked? '' : ' locked');
    let sub = `${st.maxedCount}/${z.words.length} words mastered`;
    if(unlocked && !st.cleared && st.bossReady) sub = "Gym Leader is ready!";
    div.innerHTML = `
      <div class="badge">${unlocked? z.icon : '🔒'}</div>
      <div class="info"><h3>${z.name}</h3><p>${sub}</p></div>
      ${unlocked ? `<button class="go" onclick="enterZone(${viewingRegion},${i})">${st.cleared? 'Visit' : (st.bossReady? 'Gym!' : 'Play')}</button>` : `<div class="lock-icon">🔒</div>`}
    `;
    wrap.appendChild(div);
    const c = document.createElement('div'); c.className='connector'; wrap.appendChild(c);
  });

  // Master tile
  const allBossesCleared = regionAllBossesCleared(viewingRegion);
  const masterCleared = !!state.masterCleared[viewingRegion];
  const mdiv = document.createElement('div');
  mdiv.className = 'zone master' + (allBossesCleared? '' : ' locked');
  mdiv.innerHTML = `
    <div class="badge">${allBossesCleared? '👑' : '🔒'}</div>
    <div class="info"><h3>${r.masterTitle}</h3><p>${masterCleared? 'Region mastered!' : (allBossesCleared? 'All ' + r.zones.length + ' gyms cleared — face the Master!' : 'Clear every gym in ' + r.name + ' to unlock')}</p></div>
    ${allBossesCleared ? `<button class="go" onclick="enterMaster(${viewingRegion})">${masterCleared? 'Replay' : 'Challenge'}</button>` : `<div class="lock-icon">🔒</div>`}
  `;
  wrap.appendChild(mdiv);
  updateDexButton();
}
function regionDexStats(ri){
  const words = regionAllWords(REGIONS[ri]);
  const collected = words.filter(w => (state.words[w]||0) > 0).length;
  const stars = words.reduce((s,w)=>s+Math.min(state.words[w]||0, MAX_LEVEL), 0);
  return { collected, total: words.length, stars, maxStars: words.length * MAX_LEVEL };
}
function updateDexButton(){
  const n = ALL_WORDS.filter(w => (state.words[w]||0) > 0).length;
  const badge = document.getElementById('dexCount');
  if(!badge) return;
  badge.textContent = n;
  badge.classList.toggle('show', n > 0);
}

/* ---------------- NAVIGATION ---------------- */
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function hideGymAnnounce(){
  const el = document.getElementById('gymAnnounce');
  if(el) el.classList.remove('show');
  gymStartThen = null;
}
function resetGymCard(){
  const el = document.getElementById('gymAnnounce');
  if(!el) return;
  const card = el.querySelector('.gym-announce-card');
  card.classList.remove('win', 'lose');
  const tag = el.querySelector('.gym-announce-tag');
  if(tag) tag.textContent = 'GYM BATTLE';
  const title = el.querySelector('h2');
  if(title) title.textContent = 'Gym Battle Started!';
  const line = el.querySelector('p');
  if(line) line.textContent = `Get ${GYM_STREAK} in a row to beat the gym!`;
  const btn = document.getElementById('gymGoBtn');
  if(btn){
    btn.textContent = "Let's Go!";
    btn.disabled = false;
    btn.onclick = startGymBattle;
  }
}
function setBattleChrome(){
  const flag = document.getElementById('bossFlag');
  const battle = document.getElementById('battleScreen');
  battle.classList.toggle('gym-mode', current.mode === 'boss');
  battle.classList.toggle('master-mode', current.mode === 'master');
  if(current.mode === 'boss'){
    flag.className = 'boss-flag';
    flag.style.display = 'flex';
    flag.textContent = 'GYM BATTLE';
  } else if(current.mode === 'master'){
    flag.className = 'boss-flag master';
    flag.style.display = 'flex';
    flag.textContent = 'REGION MASTER';
  } else {
    flag.style.display = 'none';
  }
}
let gymStartThen = null;
function announceGymStart(then){
  gymStartThen = then || null;
  current.streak = 0;
  current.misses = 0;
  resetGymCard();
  const el = document.getElementById('gymAnnounce');
  el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
  try{
    if(!current.voice) current.voice = pickSpeakVoice();
    speakText('Gym battle started! Get ' + GYM_STREAK + ' in a row to beat the gym!', current.voice);
  }catch(e){}
}
function startGymBattle(){
  const btn = document.getElementById('gymGoBtn');
  if(btn) btn.disabled = true;
  const next = gymStartThen;
  hideGymAnnounce();
  resetGymCard();
  stopSpeak();
  if(next) next();
}
function showGymResult(won){
  const el = document.getElementById('gymAnnounce');
  const card = el.querySelector('.gym-announce-card');
  card.classList.remove('win', 'lose');
  card.classList.add(won ? 'win' : 'lose');
  const tag = el.querySelector('.gym-announce-tag');
  if(tag) tag.textContent = won ? 'GYM CLEARED' : 'GYM OVER';
  const title = el.querySelector('h2');
  if(title) title.textContent = won ? 'Congrats! You beat the gym!' : 'Oh no! Better luck next time!';
  const line = el.querySelector('p');
  if(line) line.textContent = won ? 'The next path is open.' : 'Practice a bit more and try again!';
  const btn = document.getElementById('gymGoBtn');
  if(btn){
    btn.textContent = 'OK';
    btn.disabled = false;
    btn.onclick = finishGymResult;
  }
  el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
  try{
    const voice = current.voice || pickSpeakVoice();
    speakText(won ? 'Congrats! You beat the gym!' : 'Oh no! Better luck next time!', voice);
  }catch(e){}
}
function finishGymResult(){
  const btn = document.getElementById('gymGoBtn');
  if(btn) btn.disabled = true;
  hideGymAnnounce();
  resetGymCard();
  stopSpeak();
  toMap();
}
function toMap(){
  hideGymAnnounce();
  resetGymCard();
  stopSpeak();
  document.getElementById('battleScreen').classList.remove('gym-mode','master-mode');
  renderMap();
  showScreen('mapScreen');
}
function openDex(){ renderDex(); showScreen('dexScreen'); }

function enterZone(ri, zi){
  current.regionIndex = ri; current.zoneIndex = zi;
  const st = zoneStatus(ri, zi);
  current.mode = (st.bossReady && !st.cleared) ? 'boss' : 'zone';
  current.streak = 0;
  current.misses = 0;
  document.getElementById('zoneLabel').textContent = REGIONS[ri].zones[zi].name;
  setBattleChrome();
  showScreen('battleScreen');
  if(current.mode === 'boss'){
    nextWord({silent:true});
    announceGymStart(() => speakWord());
  } else {
    nextWord();
  }
}
function enterMaster(ri){
  current.regionIndex = ri; current.zoneIndex = null;
  current.mode = 'master'; current.streak = 0;
  document.getElementById('zoneLabel').textContent = REGIONS[ri].masterTitle;
  setBattleChrome();
  showScreen('battleScreen');
  nextWord();
}

/* ---------------- BATTLE LOGIC ---------------- */
function currentWordPool(){
  if(current.mode === 'master') return regionAllWords(REGIONS[current.regionIndex]);
  return REGIONS[current.regionIndex].zones[current.zoneIndex].words;
}
function pickWord(pool, avoid){
  let p = pool.filter(w=>state.words[w] < MAX_LEVEL);
  if(p.length===0) p = pool.slice();
  if(avoid && p.length>1) p = p.filter(w=>w!==avoid);
  return p[Math.floor(Math.random()*p.length)];
}
function nextWord(opts){
  const pool = currentWordPool();
  const word = pickWord(pool, current.word);
  current.word = word;
  current.voice = null;
  const level = Math.min(state.words[word], MAX_LEVEL);
  document.getElementById('creatureBox').innerHTML = creatureSVG(word, level);
  document.getElementById('promptText').textContent =
    current.mode === 'master' ? `Master trial! Get ${MASTER_STREAK} correct in a row!` :
    current.mode === 'boss' ? `Gym Battle! Get ${GYM_STREAK} in a row to beat the gym!` :
    `Which word is this Wildling?`;
  renderProgress();
  buildChoices(word, pool);
  if(!opts || !opts.silent) setTimeout(speakWord, 350);
}
function renderProgress(){
  const bar = document.getElementById('battleProgress');
  bar.innerHTML = '';
  if(current.mode === 'boss' || current.mode === 'master'){
    const need = current.mode === 'master' ? MASTER_STREAK : GYM_STREAK;
    for(let k=0;k<need;k++){
      const s=document.createElement('span');
      if(k<current.streak) s.classList.add('filled');
      bar.appendChild(s);
    }
  } else {
    const lvl = Math.min(state.words[current.word], MAX_LEVEL);
    for(let k=0;k<MAX_LEVEL;k++){
      const s=document.createElement('span');
      if(k<lvl) s.classList.add('filled');
      bar.appendChild(s);
    }
  }
}
function buildChoices(correctWord, pool){
  let distractSource = REGIONS[current.regionIndex] ? regionAllWords(REGIONS[current.regionIndex]) : ALL_WORDS;
  let others = distractSource.filter(w=>w!==correctWord);
  if(others.length < 3) others = ALL_WORDS.filter(w=>w!==correctWord);
  shuffle(others);
  const opts = [correctWord, ...others.slice(0,3)];
  shuffle(opts);
  const box = document.getElementById('choices');
  box.innerHTML = '';
  opts.forEach(w=>{
    const b = document.createElement('button');
    b.className = 'choice';
    b.textContent = w;
    b.onclick = ()=>handleChoice(w, correctWord, b);
    box.appendChild(b);
  });
}
function shuffle(arr){ for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } }

function handleChoice(picked, correctWord, btnEl){
  const allBtns = document.querySelectorAll('.choice');
  allBtns.forEach(b=>b.onclick=null);
  if(picked === correctWord){
    btnEl.classList.add('correct');
    onCorrect();
  } else {
    btnEl.classList.add('wrong');
    if(current.mode === 'boss'){
      current.streak = 0;
      current.misses = (current.misses || 0) + 1;
      renderProgress();
      if(current.misses >= GYM_MISSES){
        setTimeout(() => showGymResult(false), 600);
        return;
      }
      burst("Try again!");
      setTimeout(nextWord, 800);
      return;
    }
    setTimeout(()=>{
      allBtns.forEach(b=>{ b.classList.remove('wrong'); b.onclick = ()=>handleChoice(b.textContent, correctWord, b); });
    }, 550);
  }
}
function onCorrect(){
  if(current.mode === 'boss' || current.mode === 'master'){
    current.streak++;
    renderProgress();
    const need = current.mode === 'master' ? MASTER_STREAK : GYM_STREAK;
    if(current.streak >= need){
      if(current.mode === 'boss'){
        state.bossCleared[current.regionIndex+'-'+current.zoneIndex] = true;
        const ri = current.regionIndex;
        if(current.zoneIndex === (state.zoneUnlockedInRegion[ri]||0) && current.zoneIndex < REGIONS[ri].zones.length-1){
          state.zoneUnlockedInRegion[ri] = current.zoneIndex + 1;
        }
        saveState();
        setTimeout(() => showGymResult(true), 500);
      } else {
        state.masterCleared[current.regionIndex] = true;
        if(current.regionIndex === state.regionUnlocked && current.regionIndex < REGIONS.length-1){
          state.regionUnlocked = current.regionIndex + 1;
          viewingRegion = state.regionUnlocked;
        }
        saveState();
        burst("Region Mastered! 👑");
        setTimeout(toMap, 1300);
      }
      return;
    }
    burst("Nice!");
    setTimeout(nextWord, 900);
  } else {
    state.words[current.word] = Math.min(state.words[current.word]+1, MAX_LEVEL);
    const leveled = state.words[current.word];
    saveState();
    burst(leveled>=MAX_LEVEL ? "Mastered! ✨" : "Caught! +1");
    setTimeout(()=>{
      const st = zoneStatus(current.regionIndex, current.zoneIndex);
      if(st.bossReady && !st.cleared && current.mode !== 'boss'){
        current.mode = 'boss'; current.streak = 0; current.misses = 0;
        setBattleChrome();
        nextWord({silent:true});
        announceGymStart(() => speakWord());
        return;
      }
      nextWord();
    }, 1000);
  }
}
function burst(msg){
  const el = document.getElementById('caughtburst');
  el.textContent = msg;
  el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
}
function allVoices(){
  try{ return speechSynthesis.getVoices() || []; }catch(e){ return []; }
}
function findVoice(needles){
  const voices = allVoices();
  for(const needle of needles){
    const hit = voices.find(v => (v.name || '').toLowerCase().includes(needle));
    if(hit) return hit;
  }
  return voices.find(v => (v.lang || '').toLowerCase().startsWith('en')) || voices[0] || null;
}
function davidVoice(){
  return findVoice(['david', 'alex', 'daniel', 'fred']);
}
function ziraVoice(){
  return findVoice(['zira', 'samantha', 'victoria', 'karen']);
}
function pickSpeakVoice(){
  const gender = Math.random() < 0.5 ? 'female' : 'male';
  const voice = gender === 'female' ? ziraVoice() : davidVoice();
  return {
    gender,
    name: voice ? voice.name : null,
    uri: voice ? voice.voiceURI : null,
  };
}
function resolveVoice(sel){
  if(!sel) return null;
  if(sel.gender === 'female') return ziraVoice();
  if(sel.gender === 'male') return davidVoice();
  return findVoice([sel.name || '']);
}
if(window.speechSynthesis){
  speechSynthesis.addEventListener('voiceschanged', () => {});
  try{ speechSynthesis.getVoices(); }catch(e){}
}
function stopSpeak(){
  try{ speechSynthesis.cancel(); }catch(e){}
}
function speakText(text, sel){
  if(!text) return;
  try{
    stopSpeak();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 0.85;
    u.pitch = 1;
    const voice = resolveVoice(sel);
    if(voice) u.voice = voice;
    speechSynthesis.speak(u);
  }catch(e){}
}
function speakWord(){
  if(!current.word) return;
  try{
    if(!current.voice) current.voice = pickSpeakVoice();
    speakText(current.word, current.voice);
  }catch(e){}
}

/* ---------------- DEX ---------------- */
let dexRegionFilter = 0;
function renderDex(){
  dexRegionFilter = Math.min(dexRegionFilter, state.regionUnlocked);
  const tabs = document.getElementById('dexTabs');
  tabs.innerHTML = '';
  REGIONS.forEach((r,i)=>{
    if(i > state.regionUnlocked) return;
    const b = document.createElement('button');
    b.textContent = r.name;
    b.className = i===dexRegionFilter? 'active':'';
    b.onclick = ()=>{ dexRegionFilter=i; renderDex(); };
    tabs.appendChild(b);
  });
  const stats = regionDexStats(dexRegionFilter);
  const r = REGIONS[dexRegionFilter];
  document.getElementById('dexStats').innerHTML =
    `<p>You've collected <strong>${stats.collected}/${stats.total}</strong> Wildlings in ${r.name}</p>` +
    `<p class="starline">★ ${stats.stars} / ${stats.maxStars} stars</p>`;
  const grid = document.getElementById('dexGrid');
  grid.innerHTML = '';
  regionAllWords(REGIONS[dexRegionFilter]).forEach(w=>{
    const lvl = state.words[w] || 0;
    const discovered = lvl > 0;
    const div = document.createElement('div');
    div.className = 'dexcard' + (discovered? '' : ' empty') + (lvl>=MAX_LEVEL? ' maxed' : '');
    div.innerHTML = discovered
      ? `${creatureSVG(w, lvl)}<div class="w">${w}</div><div class="stars">${'★'.repeat(lvl)}${'☆'.repeat(MAX_LEVEL-lvl)}</div>`
      : `<div style="font-size:40px;opacity:0.5;">❓</div><div class="w">???</div>`;
    grid.appendChild(div);
  });
}

/* ---------------- INIT ---------------- */
loadState();
</script>
