<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wild">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#8fd3f4">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Wild</title>
<style>
  :root{
    --ink:#20362c;
    --card:#ffffffee;
    --shadow: 0 8px 0 rgba(0,0,0,0.15);
    --word-sky:#8fd3f4;
    --word-grass:#c9f2d0;
    --word-coral:#ff7a5c;
    --num-sky:#7ec8d4;
    --num-sand:#f4d4b0;
    --num-coral:#e86a3a;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;
    font-family:-apple-system,'Baloo 2','Comic Sans MS',ui-rounded,system-ui,sans-serif;
    background:linear-gradient(180deg,#8fd3f4 0%,#d8f0e8 50%,#f4d4b0 100%);
    color:var(--ink);
    touch-action:manipulation;
  }
  #app{height:100%;display:flex;flex-direction:column;align-items:center;
    justify-content:center;padding:24px 20px 32px;gap:22px;}
  .title{text-align:center;}
  .title h1{margin:0;font-size:clamp(42px,9vw,64px);font-weight:800;letter-spacing:0.5px;
    text-shadow:0 4px 0 rgba(0,0,0,0.08);}
  .title h1 em{font-style:normal;color:#ff7a5c;}
  .title p{margin:8px 0 0;font-size:16px;font-weight:700;opacity:0.7;}
  .games{display:flex;flex-wrap:wrap;justify-content:center;gap:20px;width:100%;
    max-width:860px;}
  .game{flex:1 1 280px;max-width:400px;min-height:220px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:10px;text-decoration:none;color:var(--ink);
    border-radius:28px;padding:28px 20px 24px;box-shadow:var(--shadow);
    -webkit-user-select:none;}
  .game:active{transform:translateY(6px);box-shadow:none;}
  .game.word{background:linear-gradient(180deg,var(--word-sky),var(--word-grass));}
  .game.number{background:linear-gradient(180deg,var(--num-sky),var(--num-sand));}
  .game .logo{width:88px;height:88px;filter:drop-shadow(0 4px 0 rgba(0,0,0,0.12));}
  .game .logo svg{width:100%;height:100%;display:block;}
  .game h2{margin:0;font-size:32px;font-weight:800;letter-spacing:0.2px;}
  .game.word h2 em{font-style:normal;color:var(--word-coral);}
  .game.number h2 em{font-style:normal;color:var(--num-coral);}
  .game .tag{margin:0;font-size:15px;font-weight:700;opacity:0.75;}
</style>
</head>
<body>
<div id="app">
  <div class="title">
    <h1>W<em>i</em>ld</h1>
    <p>Pick a game</p>
  </div>
  <div class="games">
    <a class="game word" href="word-wild/wordwild.html">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg">
          <circle cx="18" cy="18" r="17" fill="#ffc94d"/>
          <circle cx="11" cy="10" r="5.5" fill="#ff7a5c"/>
          <circle cx="25" cy="10" r="5.5" fill="#ff7a5c"/>
          <circle cx="18" cy="20" r="12" fill="#ff7a5c"/>
          <circle cx="14.2" cy="18" r="2.2" fill="#20362c"/>
          <circle cx="21.8" cy="18" r="2.2" fill="#20362c"/>
          <circle cx="15" cy="17.2" r="0.7" fill="#fff"/>
          <circle cx="22.6" cy="17.2" r="0.7" fill="#fff"/>
          <path d="M14 24 Q18 27.5 22 24" stroke="#20362c" fill="none" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </span>
      <h2>Word<em>Wild</em></h2>
      <p class="tag">Sight words</p>
    </a>
    <a class="game number" href="number-wild/numberwild.html">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg">
          <rect x="2" y="2" width="32" height="32" rx="6" fill="#f4c14d"/>
          <rect x="6" y="8" width="8" height="8" rx="2" fill="#e86a3a"/>
          <rect x="22" y="8" width="8" height="8" rx="2" fill="#e86a3a"/>
          <rect x="7" y="14" width="22" height="16" rx="3" fill="#e86a3a"/>
          <rect x="12" y="19" width="3" height="3" fill="#2a2418"/>
          <rect x="21" y="19" width="3" height="3" fill="#2a2418"/>
          <path d="M14 25 H22" stroke="#2a2418" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </span>
      <h2>Number<em>Wild</em></h2>
      <p class="tag">Numbers and math</p>
    </a>
  </div>
</div>
</body>
</html>
